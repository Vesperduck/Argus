name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the diff.
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Free for personal public repos. If this repo is ORG-owned, add a
          # (free) license key as a secret and uncomment the next line:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
